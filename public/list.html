<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My reading list | Paper Trail</title>
    <meta
      name="description"
      content="Triage the research papers you meant to read, with the reason you saved them still attached."
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components/form.css" />
    <link rel="stylesheet" href="css/components/entry-row.css" />
    <link rel="stylesheet" href="css/reading-list.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="site-header__brand" href="index.html">Paper Trail</a>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html">Catalog</a>
          <a href="list.html" aria-current="page">My reading list</a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">
      <h1>My reading list</h1>
      <p class="lede">
        The papers you meant to read, with the reason you saved them still attached.
      </p>

      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Add a paper</h2>

        <form id="entry-form" class="field-grid">
          <input type="hidden" id="entry-id" name="entryId" value="" />

          <div class="field field--wide">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required maxlength="300" />
          </div>

          <div class="field field--half">
            <label for="authors">Authors</label>
            <input type="text" id="authors" name="authors" maxlength="300" />
          </div>

          <div class="field field--half">
            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue" maxlength="200" />
          </div>

          <div class="field">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" min="1500" max="2100" />
          </div>

          <div class="field">
            <label for="status-input">Status</label>
            <select id="status-input" name="status">
              <option value="to-read">To read</option>
              <option value="reading">Reading</option>
              <option value="read">Read</option>
            </select>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="field">
            <label for="tags"
              >Tags <span class="field__hint">comma separated</span></label
            >
            <input type="text" id="tags" name="tags" />
          </div>

          <div class="field field--wide">
            <label for="note">Why are you saving this?</label>
            <textarea id="note" name="note" rows="3" maxlength="2000"></textarea>
          </div>

          <div class="field field--actions">
            <button type="submit" id="submit-button" class="button button--primary">
              Add to list
            </button>
            <button type="button" id="cancel-edit" class="button" hidden>
              Cancel edit
            </button>
          </div>
        </form>

        <p id="form-error" class="form-error" role="alert" hidden></p>
      </section>

      <section aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">Saved papers</h2>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort" name="sort">
              <option value="newest">Recently added</option>
              <option value="oldest">Oldest first</option>
              <option value="priority">Priority</option>
              <option value="title">Title</option>
            </select>
          </div>
        </div>

        <div class="filters" role="group" aria-label="Filter by status">
          <button type="button" class="chip" data-status="" aria-pressed="true">
            All
          </button>
          <button type="button" class="chip" data-status="to-read" aria-pressed="false">
            To read
          </button>
          <button type="button" class="chip" data-status="reading" aria-pressed="false">
            Reading
          </button>
          <button type="button" class="chip" data-status="read" aria-pressed="false">
            Read
          </button>
        </div>

        <p id="status" class="status" role="status">Loading your list...</p>

        <ul id="entries" class="entry-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>CS 5610 Web Development, Northeastern University.</p>
      </div>
    </footer>

    <script type="module" src="js/reading-list.js"></script>
  </body>
</html>
